# nginx for the Kiosk Test Studio SPA. Serves the built Vite bundle with SPA-history fallback and
# reverse-proxies /api/ (REST + the live-run WebSocket) to the QA backend, so the browser talks to
# ONE origin (no CORS, one exposed port). The QA backend runs as a SEPARATE docker-compose stack
# (robotic-vision-agent-claude), so we reach its published :8001 on the VM host via the docker
# host-gateway — see docker-compose.yml (extra_hosts).

# WebSocket proxying for /api/runs/<id>/ws needs this map. A conf.d/*.conf file is included INSIDE
# nginx's http{} block, so a top-level map here is valid.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend REST + WebSocket. No trailing slash on proxy_pass so the /api/ prefix is preserved
    # (backend routes are all under /api). host.docker.internal → the VM host → backend's :8001.
    location /api/ {
        proxy_pass http://host.docker.internal:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;            # live run updates (WebSocket)
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;                           # runs stream for minutes — hold it open
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA history fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for fingerprinted assets; never cache index.html (so new deploys are picked up).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
